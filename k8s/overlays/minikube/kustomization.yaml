apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: vllm-cpu
    newTag: 0.31.0
  - name: model-downloader
    newTag: 1.0.0
patches:
  - target:
      kind: Deployment
      name: vllm
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: Never
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
